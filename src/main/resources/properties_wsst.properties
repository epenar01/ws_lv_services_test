# ===== Broker / Intermediario (tokenizacion PCI) =====
# URL del sistema DESTINO (servicio de tokenizacion) al que se reenviara
# el payload del ORIGEN. Cambiar segun entorno (QA / PROD).
wsst.broker.destino.url=https://nnigma.liverpool.com.mx:443/get-online-token

# Timeouts del cliente HTTP saliente (milisegundos)
wsst.broker.destino.timeout.connect.ms=5000
wsst.broker.destino.timeout.read.ms=15000


# ===== Consulta Transacciones Debito Prosa (API Base24) =====
# Flujo: POS -> ws_services_test -> API B24 -> Key Monitor.
# ws_services_test recibe la consulta del POS y la REENVIA a la API B24,
# inyectando el header Authorization: Basic con las credenciales de abajo.

# Destino real (API B24) al que se reenvia la consulta. Cambiar por entorno.
wsst.prosa.consulta.url=http://172.16.216.113:6000/ConsultaTransacciones/

# Credenciales Basic que ws_services_test INYECTA hacia B24 (B24 las exige).
# Por ahora admin/admin (QA). NUNCA se escriben en los logs.
wsst.prosa.consulta.auth.user=admin
wsst.prosa.consulta.auth.password=admin

# Timeouts del cliente HTTP saliente hacia B24 (milisegundos)
wsst.prosa.consulta.timeout.connect.ms=5000
wsst.prosa.consulta.timeout.read.ms=15000

# Enmascarar el PAN (campo "tarjeta") en los logs.
#   false = se ve completo  -> MONITOREO (estado actual solicitado)
#   true  = se ve 627535****8754 -> cumple PCI-DSS
# Cambiar a true cuando ya no se necesite monitorear el PAN completo.
wsst.prosa.consulta.log.mask.pan=false
