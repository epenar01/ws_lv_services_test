# ===== Servidor HTTPS embebido =====
server.port=7443
server.ssl.enabled=true
server.ssl.key-store=classpath:localhost-rsa.jks
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12

# Context path (mantiene la URL identica a la del despliegue en Tomcat)
server.servlet.context-path=/ws_services_test

# Jersey servlet mapping
spring.jersey.application-path=/rest

# Logging: la configuracion completa vive en src/main/resources/log4j2.xml.

# ===== Configuracion del broker (se cargan en PropertiesForWsServices) =====
# Estas keys las lee InitLoadProperties.java al arranque desde
# src/main/resources/properties_wsst.properties (queda dentro del JAR).
